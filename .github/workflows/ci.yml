name: MediaTrust CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pydantic-settings

      - name: Generate test sample fixtures
        run: |
          python backend/scripts/generate_sample_fixtures.py

      - name: Train baseline model checkpoint
        run: |
          python backend/scripts/train_image_classifier.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
